# Direct Debian build retry for the persistent WhatsApp text-size release.
name: Debian package

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "makers/MakerDeb.ts"
      - "forge.config.ts"
      - "package.json"
      - "yarn.lock"
      - "src/**"
      - "public/**"
      - ".github/workflows/debian.yml"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg desktop-file-utils appstream

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Altus DEB
        run: yarn run make -p linux --arch x64

      - name: Locate and validate package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DEB_FILE="$(find out/make -maxdepth 2 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb package was generated"
            find out -maxdepth 4 -type f -print || true
            exit 1
          fi

          DEB_VERSION="$(dpkg-deb -f "$DEB_FILE" Version)"
          echo "file=$DEB_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DEB_FILE")" >> "$GITHUB_OUTPUT"
          echo "version=$DEB_VERSION" >> "$GITHUB_OUTPUT"

          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE" > /tmp/altus-deb-contents.txt
          sed -n '1,120p' /tmp/altus-deb-contents.txt

          rm -rf /tmp/altus-deb-root
          dpkg-deb -x "$DEB_FILE" /tmp/altus-deb-root

          test -x /tmp/altus-deb-root/opt/Altus/Altus
          test -L /tmp/altus-deb-root/usr/bin/altus
          test -f /tmp/altus-deb-root/usr/share/applications/harwara.aman.altus.desktop
          test -f /tmp/altus-deb-root/usr/share/icons/hicolor/256x256/apps/harwara.aman.altus.png
          test -f /tmp/altus-deb-root/usr/share/metainfo/harwara.aman.altus.metainfo.xml

          desktop-file-validate /tmp/altus-deb-root/usr/share/applications/harwara.aman.altus.desktop
          appstreamcli validate /tmp/altus-deb-root/usr/share/metainfo/harwara.aman.altus.metainfo.xml

          grep -q '^Exec=/usr/bin/altus %U$' /tmp/altus-deb-root/usr/share/applications/harwara.aman.altus.desktop
          grep -q '^Icon=harwara.aman.altus$' /tmp/altus-deb-root/usr/share/applications/harwara.aman.altus.desktop
          grep -q '<launchable type="desktop-id">harwara.aman.altus.desktop</launchable>' /tmp/altus-deb-root/usr/share/metainfo/harwara.aman.altus.metainfo.xml
          grep -R -q 'Tamanho do Texto' /tmp/altus-deb-root/opt/Altus/resources/app
          grep -R -q 'Linux version by DaNiLoStOrM' /tmp/altus-deb-root/opt/Altus/resources/app

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: altus-deb-amd64
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_FILE: ${{ steps.package.outputs.file }}
          DEB_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="deb-v${DEB_VERSION}"
          TITLE="Altus v${DEB_VERSION} - Debian/Ubuntu"
          NOTES="Pacote .deb amd64 do Altus v${DEB_VERSION}. Inclui ajuste persistente de tamanho do texto do WhatsApp (80% a 175%), atalhos Ctrl +, Ctrl - e Ctrl 0, integração com menu/ícone e crédito da versão Linux para DaNiLoStOrM — hoststorm.cloud. Instale com: sudo apt install ./$(basename "$DEB_FILE")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB_FILE" --clobber
          else
            gh release create "$TAG" "$DEB_FILE" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Record build status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          DEB_NAME: ${{ steps.package.outputs.name }}
          DEB_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          if [ -z "${DEB_VERSION}" ]; then
            DEB_VERSION="$(node -p "require('./package.json').version")-5"
          fi

          mkdir -p .build
          cat > .build/debian-status.json <<EOF
          {
            "status": "${BUILD_STATUS}",
            "version": "${DEB_VERSION}",
            "architecture": "amd64",
            "deb_name": "${DEB_NAME}",
            "release_tag": "deb-v${DEB_VERSION}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build/debian-status.json
          git commit -m "record Debian build status" || exit 0
          git pull --rebase origin master
          git push origin HEAD:master
