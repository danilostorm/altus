name: Add Linux credit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/add-linux-credit.yml"

permissions:
  contents: write

jobs:
  patch-credit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add Linux credit and bump Debian revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("src/main.ts")
          main_text = main_path.read_text(encoding="utf-8")
          old_credit = "message: `Made by Aman Harwara.`,"
          new_credit = "message: `Made by Aman Harwara.\\nLinux version by DaNiLoStOrM — hoststorm.cloud`,"
          if old_credit not in main_text:
              raise SystemExit("About dialog credit marker was not found")
          main_path.write_text(main_text.replace(old_credit, new_credit, 1), encoding="utf-8")

          maker_path = Path("makers/MakerDeb.ts")
          maker_text = maker_path.read_text(encoding="utf-8")
          old_revision = 'const DEBIAN_REVISION = "3";'
          new_revision = 'const DEBIAN_REVISION = "4";'
          if old_revision not in maker_text:
              raise SystemExit("Debian revision marker was not found")
          maker_path.write_text(maker_text.replace(old_revision, new_revision, 1), encoding="utf-8")

          Path(".github/workflows/add-linux-credit.yml").unlink()
          PY

      - name: Commit Linux credit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts makers/MakerDeb.ts .github/workflows/add-linux-credit.yml
          git commit -m "credit DaNiLoStOrM for Linux version"
          git pull --rebase origin master
          git push origin HEAD:master
